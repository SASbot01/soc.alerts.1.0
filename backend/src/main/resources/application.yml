spring:
  application:
    name: blackwolf-backend
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/${MYSQL_DATABASE:blackwolf}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    placeholder-replacement: false

minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER:minioadmin}
  secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
  bucket: ${MINIO_BUCKET:blackwolf-assets}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS:900000}
  refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}
  cookie-secure: ${JWT_COOKIE_SECURE:false}

spring.mail:
  host: ${MAIL_HOST:localhost}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  properties:
    mail.smtp.auth: false
    mail.smtp.starttls.enable: false

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:80}

# Threat Intelligence
threatintel:
  abuseipdb:
    api-key: ${ABUSEIPDB_API_KEY:}
    enabled: ${ABUSEIPDB_ENABLED:false}

# Alert defaults
alerts:
  from-email: ${ALERT_FROM_EMAIL:soc@blackwolf.io}
  global-slack-webhook: ${GLOBAL_SLACK_WEBHOOK:}
  global-slack-enabled: ${GLOBAL_SLACK_ENABLED:true}

# Actuator & Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true

info:
  app:
    name: BlackWolf SOC
    version: 2.0.0
    description: Enterprise Security Operations Platform

# AI Chat (Claude)
ai:
  claude:
    api-key: ${CLAUDE_API_KEY:}
    model: ${CLAUDE_MODEL:claude-sonnet-4-20250514}
    max-tokens: ${CLAUDE_MAX_TOKENS:4096}
    enabled: ${CLAUDE_ENABLED:false}
  agent:
    enabled: ${AI_AGENT_ENABLED:false}
    max-tokens: ${AI_AGENT_MAX_TOKENS:8192}
    slack-webhook: ${AI_AGENT_SLACK_WEBHOOK:}
    slack-enabled: ${AI_AGENT_SLACK_ENABLED:false}
    cron: ${AI_AGENT_CRON:0 0 */6 * * *}
    analysis-hours: ${AI_AGENT_ANALYSIS_HOURS:24}
    autonomous:
      enabled: ${AI_AUTONOMOUS_ENABLED:false}
      max-tokens: ${AI_AUTONOMOUS_MAX_TOKENS:4096}
      batch-interval-ms: ${AI_AUTONOMOUS_BATCH_INTERVAL_MS:120000}
      critical-threshold: ${AI_AUTONOMOUS_CRITICAL_THRESHOLD:8}
      auto-block: ${AI_AUTONOMOUS_AUTO_BLOCK:true}
      auto-incident: ${AI_AUTONOMOUS_AUTO_INCIDENT:true}
      noise-learning: ${AI_AUTONOMOUS_NOISE_LEARNING:true}
