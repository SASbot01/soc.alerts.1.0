name: blackwolf-soc

services:
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: blackwolf
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - blackwolf-net
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  minio:
    image: minio/minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - blackwolf-net

  lldap:
    image: lldap/lldap:latest
    restart: always
    environment:
      LLDAP_JWT_SECRET: ${LDAP_JWT_SECRET:-change-me-jwt-secret-blackwolf}
      LLDAP_LDAP_USER_PASS: ${LDAP_ADMIN_PASSWORD:-admin1234}
      LLDAP_LDAP_BASE_DN: ${LDAP_BASE_DN:-dc=blackwolf,dc=io}
      LLDAP_DATABASE_URL: sqlite:///data/lldap_db.sqlite?mode=rwc
    ports:
      - "3890:3890"
      - "17170:17170"
    volumes:
      - lldap_data:/data
    networks:
      - blackwolf-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:17170 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - blackwolf-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - blackwolf-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.backend
    restart: always
    ports:
      - "8081:8080"
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: blackwolf
      MYSQL_USER: root
      MYSQL_PASSWORD: admin
      MINIO_URL: http://minio:9000
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-true}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
      GLOBAL_SLACK_WEBHOOK: ${GLOBAL_SLACK_WEBHOOK:-}
      GLOBAL_SLACK_ENABLED: ${GLOBAL_SLACK_ENABLED:-true}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-20250514}
      CLAUDE_MAX_TOKENS: ${CLAUDE_MAX_TOKENS:-4096}
      CLAUDE_ENABLED: ${CLAUDE_ENABLED:-true}
      AI_AGENT_ENABLED: ${AI_AGENT_ENABLED:-true}
      AI_AGENT_MAX_TOKENS: ${AI_AGENT_MAX_TOKENS:-8192}
      AI_AGENT_SLACK_WEBHOOK: ${AI_AGENT_SLACK_WEBHOOK:-}
      AI_AGENT_SLACK_ENABLED: ${AI_AGENT_SLACK_ENABLED:-true}
      AI_AGENT_CRON: ${AI_AGENT_CRON:-0 0 */6 * * *}
      AI_AGENT_ANALYSIS_HOURS: ${AI_AGENT_ANALYSIS_HOURS:-24}
      AI_AUTONOMOUS_ENABLED: ${AI_AUTONOMOUS_ENABLED:-true}
      AI_AUTONOMOUS_MAX_TOKENS: ${AI_AUTONOMOUS_MAX_TOKENS:-4096}
      AI_AUTONOMOUS_BATCH_INTERVAL_MS: ${AI_AUTONOMOUS_BATCH_INTERVAL_MS:-120000}
      AI_AUTONOMOUS_CRITICAL_THRESHOLD: ${AI_AUTONOMOUS_CRITICAL_THRESHOLD:-8}
      AI_AUTONOMOUS_AUTO_BLOCK: ${AI_AUTONOMOUS_AUTO_BLOCK:-true}
      AI_AUTONOMOUS_AUTO_INCIDENT: ${AI_AUTONOMOUS_AUTO_INCIDENT:-true}
      AI_AUTONOMOUS_NOISE_LEARNING: ${AI_AUTONOMOUS_NOISE_LEARNING:-true}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_STARTER: ${STRIPE_PRICE_STARTER:-}
      STRIPE_PRICE_PROFESSIONAL: ${STRIPE_PRICE_PROFESSIONAL:-}
      STRIPE_PRICE_ENTERPRISE: ${STRIPE_PRICE_ENTERPRISE:-}
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      ALERT_FROM_EMAIL: ${ALERT_FROM_EMAIL:-soc@blackwolf.io}
      APP_BASE_URL: ${APP_BASE_URL:-https://soc.blackwolfsec.io}
      PROSPECTOR_API_KEY: ${PROSPECTOR_API_KEY:-}
      LDAP_URL: http://lldap:17170
      LDAP_ADMIN_USER: admin
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-admin1234}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-dc=blackwolf,dc=io}
      CORS_ALLOWED_ORIGINS: https://soc.blackwolfsec.io,http://soc.blackwolfsec.io,http://localhost:5173,http://localhost:80
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      lldap:
        condition: service_healthy
    networks:
      - blackwolf-net

  frontend:
    build:
      context: ../frontend
      dockerfile: ../deploy/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api/v1
    restart: always
    ports:
      - "80:80"
    volumes:
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
    networks:
      - blackwolf-net

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel run
    environment:
      TUNNEL_TOKEN: eyJhIjoiZTI4YjU5NjQ4ZGI0ZTc1NTEwZDljNWE3MDQwZjFjNmMiLCJ0IjoiMDk2OWM2NWEtMWJlYS00YTE0LTkxYTQtNzAxODFiYjYxNjRhIiwicyI6Ik1EZGxZall3TXpBdFlqRmhPUzAwTnpBeExUbGtNekF0T1RBMk5UWTRNVGMzT0dWbSJ9
    depends_on:
      - frontend
      - backend
    networks:
      - blackwolf-net

  suricata:
    image: jasonish/suricata:7.0
    restart: always
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    volumes:
      - suricata_logs:/var/log/suricata
      - ./suricata/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ./suricata/threshold.config:/etc/suricata/threshold.config:ro
      - ./suricata/scan-detect.rules:/etc/suricata/scan-detect.rules:ro
    entrypoint:
      - suricata
      - -c
      - /etc/suricata/suricata.yaml
      - -i
      - ${SURICATA_INTERFACE:-enp1s0}

  suricata-bridge:
    build:
      context: ./suricata-bridge
    restart: always
    depends_on:
      - backend
      - suricata
    volumes:
      - suricata_logs:/var/log/suricata:ro
    environment:
      EVE_JSON_PATH: /var/log/suricata/eve.json
      SOC_API_URL: http://backend:8080/api/v1
      SOC_API_KEY: ${SOC_API_KEY}
      SOC_COMPANY_ID: ${SOC_COMPANY_ID}
      SOC_SENSOR_ID: ${SOC_SENSOR_ID:-sensor-suricata-ids}
      BRIDGE_BATCH_INTERVAL: ${BRIDGE_BATCH_INTERVAL:-10}
    networks:
      - blackwolf-net

  auth-monitor:
    build:
      context: ./auth-monitor
    restart: always
    depends_on:
      - backend
    volumes:
      - /var/log/auth.log:/var/log/auth.log:ro
    environment:
      AUTH_LOG_PATH: /var/log/auth.log
      SOC_API_URL: http://backend:8080/api/v1
      SOC_API_KEY: ${SOC_API_KEY}
      SOC_COMPANY_ID: ${SOC_COMPANY_ID}
      SOC_SENSOR_ID: sensor-auth-monitor
      BRIDGE_BATCH_INTERVAL: ${BRIDGE_BATCH_INTERVAL:-10}
    networks:
      - blackwolf-net

  honeypot:
    build:
      context: ./honeypot
    restart: always
    depends_on:
      - backend
    ports:
      - "${HONEYPOT_SSH_PORT:-2222}:2222"
      - "${HONEYPOT_HTTP_PORT:-8443}:8443"
      - "${HONEYPOT_FTP_PORT:-2121}:2121"
      - "${HONEYPOT_TELNET_PORT:-2323}:2323"
      - "${HONEYPOT_SMTP_PORT:-2525}:2525"
      - "${HONEYPOT_MYSQL_PORT:-13306}:13306"
      - "${HONEYPOT_RDP_PORT:-13389}:13389"
    environment:
      HONEYPOT_SSH_PORT: "2222"
      HONEYPOT_HTTP_PORT: "8443"
      HONEYPOT_FTP_PORT: "2121"
      HONEYPOT_TELNET_PORT: "2323"
      HONEYPOT_SMTP_PORT: "2525"
      HONEYPOT_MYSQL_PORT: "13306"
      HONEYPOT_RDP_PORT: "13389"
      SOC_API_URL: http://backend:8080/api/v1
      SOC_API_KEY: ${SOC_API_KEY}
      SOC_COMPANY_ID: ${SOC_COMPANY_ID}
      SOC_SENSOR_ID: sensor-honeypot
      BRIDGE_BATCH_INTERVAL: ${BRIDGE_BATCH_INTERVAL:-10}
      HOST_IP: ${HOST_IP:-192.168.1.39}
    networks:
      - blackwolf-net

  nginx-monitor:
    build:
      context: ./nginx-monitor
    restart: always
    depends_on:
      - frontend
      - backend
    volumes:
      - nginx_logs:/var/log/nginx:ro
    environment:
      ACCESS_LOG_PATH: /var/log/nginx/access.log
      SOC_API_URL: http://backend:8080/api/v1
      SOC_API_KEY: ${SOC_API_KEY}
      SOC_COMPANY_ID: ${SOC_COMPANY_ID}
      SOC_SENSOR_ID: sensor-nginx-waf
      BRIDGE_BATCH_INTERVAL: ${BRIDGE_BATCH_INTERVAL:-10}
      HOST_IP: ${HOST_IP:-192.168.1.39}
      SCAN_THRESHOLD: "20"
      TRUSTED_PREFIXES: "127.0.0.,198.41.192."
    networks:
      - blackwolf-net

  backup-monitor:
    build:
      context: ./backup-monitor
    restart: always
    depends_on:
      - backend
    environment:
      SOC_API_URL: http://backend:8080/api/v1
      SOC_API_KEY: ${SOC_API_KEY}
      SOC_COMPANY_ID: ${SOC_COMPANY_ID}
      CHECK_INTERVAL: ${BACKUP_CHECK_INTERVAL:-3600}
      BACKUP_DIRS: ${BACKUP_DIRS:-/var/backups}
      MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-25}
    volumes:
      - /var/backups:/var/backups:ro
    networks:
      - blackwolf-net

  linkedin-prospector:
    build:
      context: ../linkedin-prospector
    restart: always
    depends_on:
      - backend
    environment:
      LINKEDIN_EMAIL: ${LINKEDIN_EMAIL:-}
      LINKEDIN_PASSWORD: ${LINKEDIN_PASSWORD:-}
      BACKEND_URL: http://backend:8080/api/v1
      PROSPECTOR_API_KEY: ${PROSPECTOR_API_KEY:-}
      MAX_CONNECTIONS_PER_DAY: ${PROSPECTOR_MAX_CONNECTIONS:-20}
      MAX_CONNECTIONS_WEEKEND: ${PROSPECTOR_MAX_CONNECTIONS_WEEKEND:-5}
      MAX_MESSAGES_PER_DAY: ${PROSPECTOR_MAX_MESSAGES:-15}
      MIN_DELAY_SECONDS: ${PROSPECTOR_MIN_DELAY:-180}
      MAX_DELAY_SECONDS: ${PROSPECTOR_MAX_DELAY:-420}
      WORK_HOUR_START: ${PROSPECTOR_WORK_START:-9}
      WORK_HOUR_END: ${PROSPECTOR_WORK_END:-18}
      GOOGLE_SEARCH_ENABLED: ${PROSPECTOR_GOOGLE_ENABLED:-true}
      SMTP_VERIFY_ENABLED: ${PROSPECTOR_SMTP_VERIFY:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PUBLISH_ENABLED: ${PROSPECTOR_PUBLISH_ENABLED:-true}
      PUBLISH_HOUR_1: ${PROSPECTOR_PUBLISH_HOUR_1:-10}
      PUBLISH_HOUR_2: ${PROSPECTOR_PUBLISH_HOUR_2:-16}
      LINKEDIN_COOKIES_PATH: /app/cookies/li_cookies.json
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      ALERT_FROM_EMAIL: ${ALERT_FROM_EMAIL:-}
      EMAIL_OUTREACH_ENABLED: ${EMAIL_OUTREACH_ENABLED:-true}
    volumes:
      - linkedin_cookies:/app/cookies
    networks:
      - blackwolf-net

networks:
  blackwolf-net:
    driver: bridge

volumes:
  mysql_data:
  lldap_data:
  minio_data:
  redis_data:
  es_data:
  suricata_logs:
  nginx_logs:
  linkedin_cookies:
