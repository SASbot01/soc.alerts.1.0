<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
  <title>BlackWolf SOC — Connect</title>
  <link rel="stylesheet" href="connect.css">
</head>
<body>
  <div class="container">
    <!-- Logo -->
    <div class="logo-section">
      <div class="shield-icon">
        <svg width="64" height="76" viewBox="0 0 64 76" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M32 2L60 16V42C60 60 48 70 32 74C16 70 4 60 4 42V16L32 2Z"
                stroke="#f59e0b" stroke-width="2.5" fill="rgba(245,158,11,0.08)"/>
          <line x1="24" y1="28" x2="28" y2="52" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
          <line x1="31" y1="26" x2="33" y2="54" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
          <line x1="38" y1="28" x2="40" y2="52" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>
      <h1 class="title">BlackWolf SOC</h1>
      <p class="subtitle">Security Operations Center</p>
    </div>

    <!-- Connection Form -->
    <div class="form-section">
      <label for="server-url" class="label">SOC Server URL</label>
      <p class="hint">Enter the URL where your BlackWolf SOC platform is deployed</p>
      <div class="input-row">
        <input
          type="text"
          id="server-url"
          class="input"
          placeholder="https://soc.yourcompany.com"
          spellcheck="false"
          autocomplete="off"
        >
        <button id="connect-btn" class="btn-connect">
          <span class="btn-text">Connect</span>
          <span class="btn-spinner hidden">
            <svg class="spinner" width="18" height="18" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"
                      fill="none" stroke-dasharray="31.4 31.4" stroke-linecap="round"/>
            </svg>
          </span>
        </button>
      </div>

      <!-- Status -->
      <div id="status-msg" class="status-msg hidden"></div>

      <!-- Saved Servers -->
      <div id="saved-servers-section" class="saved-servers-section hidden">
        <label class="label label-small">Recent Servers</label>
        <div id="saved-servers-list" class="saved-servers-list"></div>
      </div>

      <!-- Options -->
      <div class="options-section">
        <label class="checkbox-label">
          <input type="checkbox" id="self-signed-check">
          Accept self-signed certificates
        </label>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <span id="app-version" class="version">v1.0.0</span>
    </div>
  </div>

  <script>
    const serverUrlInput = document.getElementById('server-url');
    const connectBtn = document.getElementById('connect-btn');
    const btnText = connectBtn.querySelector('.btn-text');
    const btnSpinner = connectBtn.querySelector('.btn-spinner');
    const statusMsg = document.getElementById('status-msg');
    const savedServersSection = document.getElementById('saved-servers-section');
    const savedServersList = document.getElementById('saved-servers-list');
    const selfSignedCheck = document.getElementById('self-signed-check');
    const appVersion = document.getElementById('app-version');

    let isConnecting = false;

    async function init() {
      try {
        const version = await window.blackwolf.getAppVersion();
        appVersion.textContent = 'v' + version;

        const selfSigned = await window.blackwolf.getAcceptSelfSigned();
        selfSignedCheck.checked = selfSigned;

        await loadSavedServers();
      } catch (err) {
        console.error('Init error:', err);
      }
    }

    async function loadSavedServers() {
      const { servers, lastServer } = await window.blackwolf.getSavedServers();

      if (lastServer && !serverUrlInput.value) {
        serverUrlInput.value = lastServer;
      }

      if (servers.length > 0) {
        savedServersSection.classList.remove('hidden');
        savedServersList.innerHTML = '';

        servers.forEach(url => {
          const item = document.createElement('div');
          item.className = 'saved-server-item';
          item.innerHTML = `
            <button class="saved-server-url" title="${url}">${url}</button>
            <button class="saved-server-remove" title="Remove">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          `;

          item.querySelector('.saved-server-url').addEventListener('click', () => {
            serverUrlInput.value = url;
            connect();
          });

          item.querySelector('.saved-server-remove').addEventListener('click', async (e) => {
            e.stopPropagation();
            await window.blackwolf.removeSavedServer(url);
            await loadSavedServers();
          });

          savedServersList.appendChild(item);
        });
      } else {
        savedServersSection.classList.add('hidden');
      }
    }

    function setLoading(loading) {
      isConnecting = loading;
      connectBtn.disabled = loading;
      serverUrlInput.disabled = loading;
      btnText.classList.toggle('hidden', loading);
      btnSpinner.classList.toggle('hidden', !loading);
    }

    function showStatus(message, type) {
      statusMsg.textContent = message;
      statusMsg.className = 'status-msg status-' + type;
    }

    function hideStatus() {
      statusMsg.className = 'status-msg hidden';
    }

    async function connect() {
      const url = serverUrlInput.value.trim();
      if (!url) {
        showStatus('Please enter a server URL.', 'error');
        serverUrlInput.focus();
        return;
      }

      hideStatus();
      setLoading(true);
      showStatus('Connecting to server...', 'info');

      try {
        await window.blackwolf.setAcceptSelfSigned(selfSignedCheck.checked);
        const result = await window.blackwolf.connectToServer(url);

        if (result.success) {
          showStatus('Connected! Loading SOC dashboard...', 'success');
        } else {
          showStatus(result.error || 'Connection failed.', 'error');
          setLoading(false);
        }
      } catch (err) {
        showStatus('An unexpected error occurred.', 'error');
        setLoading(false);
      }
    }

    connectBtn.addEventListener('click', connect);

    serverUrlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !isConnecting) connect();
    });

    selfSignedCheck.addEventListener('change', async () => {
      await window.blackwolf.setAcceptSelfSigned(selfSignedCheck.checked);
    });

    serverUrlInput.focus();
    init();
  </script>
</body>
</html>
